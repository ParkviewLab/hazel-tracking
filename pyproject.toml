[project]
name = "hazel-tracking"
version = "0.1.0.dev0"
description = "The ParkviewLab Engineering Dashboard: one page showing the present state of every ParkviewLab repository, gathered from GitHub each time it is shown."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Gary Frattarola", email = "garyf@parkviewlab.ai" }]
# tzdata: the IANA zones for TZ, which the slim image may lack (docs/what-it-shows.md).
dependencies = [
    "nicegui",
    "httpx",
    "packaging",
    "tzdata",
]

[project.scripts]
hazel-tracking = "hazel_tracking.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hazel_tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The NiceGUI main file that nicegui.testing's `user` fixture executes for each page test.
main_file = "tests/page_main.py"
markers = [
    "network: tests that require outbound network access",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]                     # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.13"
